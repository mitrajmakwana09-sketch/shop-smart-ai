<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Orders | Shop Smart AI</title>
<style>
*{box-sizing:border-box;margin:0}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#f4f7fb;color:#14213d;line-height:1.5}
a{text-decoration:none;color:inherit}

/* Header */
header{position:sticky;top:0;z-index:10;background:#fff;display:flex;justify-content:space-between;align-items:center;
  padding:16px 5vw;box-shadow:0 2px 10px rgba(0,0,0,.06);flex-wrap:wrap;gap:10px}
.logo{font-size:1.6rem;font-weight:800;color:#0a7bc4}
.logo span{color:#12a150}
nav{display:flex;align-items:center;gap:22px;font-weight:600;flex-wrap:wrap}
nav a:hover{color:#0a7bc4}
#aiAgentLink{display:none;background:linear-gradient(90deg,#0a7bc4,#12a150);color:#fff;padding:6px 14px;border-radius:999px}
#aiAgentLink:hover{color:#fff;filter:brightness(1.1)}

/* Page */
main{max-width:820px;margin:0 auto;padding:32px 5vw 60px}
h1{font-size:1.8rem;margin-bottom:4px}
.sub{color:#5b6b82;margin-bottom:22px}

/* Order card */
.order{background:#fff;border-radius:14px;padding:16px 18px;margin-bottom:14px;
  display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;
  box-shadow:0 4px 14px rgba(10,40,80,.08);border-left:5px solid #12a150}
.order strong{font-size:1.05rem}
.order small{display:block;color:#5b6b82;margin-top:2px}
.right{text-align:right}
.price{font-weight:800;font-size:1.2rem}
.status{display:inline-block;margin-top:4px;background:#e3f7ec;color:#0d7a3e;font-size:.8rem;font-weight:700;
  padding:3px 10px;border-radius:999px}

/* Messages */
.box{background:#fff;border-radius:16px;padding:44px 20px;text-align:center;color:#5b6b82;
  box-shadow:0 4px 14px rgba(10,40,80,.08)}
.box .ic{font-size:3rem;margin-bottom:8px}
.box h2{color:#14213d;margin-bottom:6px}
.btn{display:inline-block;margin-top:16px;background:#0a7bc4;color:#fff;padding:11px 26px;border-radius:10px;font-weight:700}
.btn:hover{filter:brightness(1.1)}

footer{text-align:center;color:#5b6b82;padding:24px 5vw;border-top:1px solid #dbe3ec}
@media(max-width:600px){.right{text-align:left}}
</style>
</head>
<body>

<header>
  <a class="logo" href="index.html">Shop Smart <span>AI</span></a>
  <nav>
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
    <a href="my-order.html">My Orders</a>
    <a href="cart.html">Cart</a>
    <a href="ai-assistant.html" id="aiAgentLink">🤖 AI Agent</a>
    <a href="login.html" id="loginLink">Login</a>
  </nav>
</header>

<main>
  <h1>My Orders</h1>
  <p class="sub">Tamara badha orders ahiya dekhase.</p>
  <div id="content"></div>
</main>

<footer>© Shop Smart AI</footer>

<script>
(function () {
  var content = document.getElementById("content");

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function fmt(n) { return "₹" + Number(n || 0).toLocaleString("en-IN"); }

  // Login thayu chhe ke nahi (isLoggedIn ke user key check thase)
  var loggedIn = false;
  try {
    loggedIn = localStorage.getItem("isLoggedIn") === "true" || !!localStorage.getItem("user");
  } catch (e) {}

  // Login nathi: error ni jagya e message batavo
  if (!loggedIn) {
    content.innerHTML =
      '<div class="box"><div class="ic">🔒</div><h2>Pehla login karo</h2>' +
      '<p>Tamara orders jova mate login karvu jaruri chhe.</p>' +
      '<a class="btn" href="login.html">Login</a></div>';
    return;
  }

  // Login thayu chhe: AI Agent batavo, Login ni jagya e Logout
  var ai = document.getElementById("aiAgentLink");
  var login = document.getElementById("loginLink");
  if (ai) ai.style.display = "inline-block";
  if (login) {
    login.textContent = "Logout";
    login.href = "#";
    login.addEventListener("click", function (e) {
      e.preventDefault();
      try {
        localStorage.removeItem("isLoggedIn");
        localStorage.removeItem("user");
      } catch (err) {}
      window.location.href = "login.html";
    });
  }

  // Orders vancho ("orders", "myOrders" ke "order" key mathi)
  var orders = [];
  ["orders", "myOrders", "order"].some(function (key) {
    try {
      var data = JSON.parse(localStorage.getItem(key) || "null");
      if (Array.isArray(data) && data.length) { orders = data; return true; }
    } catch (e) {}
    return false;
  });

  if (!orders.length) {
    content.innerHTML =
      '<div class="box"><div class="ic">📦</div><h2>Haju koi order nathi</h2>' +
      '<p>Tame product kharidso pachi ahiya dekhase.</p>' +
      '<a class="btn" href="products.html">Shop Now</a></div>';
    return;
  }

  content.innerHTML = orders.map(function (o) {
    var name  = o.name || o.title || o.productName || "Product";
    var price = o.price || o.total || o.amount || 0;
    var date  = o.date || o.createdAt || "";
    var id    = o.id || o.orderId || o.paymentId || "";
    return '<div class="order"><div><strong>' + esc(name) + '</strong>' +
      (date ? '<small>' + esc(date) + '</small>' : '') +
      (id ? '<small>Order ID: ' + esc(id) + '</small>' : '') +
      '</div><div class="right"><div class="price">' + fmt(price) + '</div>' +
      '<span class="status">Order placed</span></div></div>';
  }).join("");
})();
</script>
</body>
</html>
