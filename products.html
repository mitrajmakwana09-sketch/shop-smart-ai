    [25,"5G Smartphone 8GB / 128GB 50MP","Mobiles","Nova",9999,13999,4.4,1780,4,"photo-1592899677977-9c10ca588bbd"],
    [26,"True Wireless Earbuds","Electronics","SoundMax",1299,2999,4.3,4100,80,"photo-1590658268037-6bf12165a8df"],
    [27,"8-inch Android Tablet 3GB / 32GB","Electronics","TabPro",6999,9999,4.0,340,17,"photo-1544244015-0df4b3ffc6b0"]
  ].map(a => ({ id: a[0], name: a[1], category: a[2], brand: a[3], price: a[4], oldPrice: a[5], rating: a[6], reviews: a[7], stock: a[8],
                image: "https://images.unsplash.com/" + a[9] + "?w=120", base: true }));

  /* =========================================================
     STORAGE (error vagar)
     customProducts   : add-product.html na products
     productOverrides : { id: { price, oldPrice, stock, hidden } }
     ========================================================= */
  function readJSON(key, fb) { try { const v = JSON.parse(localStorage.getItem(key)); return v == null ? fb : v; } catch (e) { return fb; } }
  function writeJSON(key, v) {
    try { localStorage.setItem(key, JSON.stringify(v)); return true; }
    catch (e) { showToast("Save na thayu (browser storage bharayu ke block chhe)"); return false; }
  }
  const getCustom = () => { const l = readJSON("customProducts", []); return Array.isArray(l) ? l.filter(p => p && p.id && p.name) : []; };
  const getOv = () => { const o = readJSON("productOverrides", {}); return o && typeof o === "object" && !Array.isArray(o) ? o : {}; };

  function allProducts() {
    const ov = getOv();
    const list = BASE.map(b => {
      const o = ov[b.id] || {};
      return Object.assign({}, b,
        "price" in o ? { price: Number(o.price) } : {}, "oldPrice" in o ? { oldPrice: Number(o.oldPrice) } : {}, "stock" in o ? { stock: Number(o.stock) } : {},
        { hidden: !!o.hidden, edited: "price" in o || "oldPrice" in o || "stock" in o });
    });
    getCustom().forEach(c => list.push(Object.assign(
      { category: "General", brand: "Generic", rating: 4, reviews: 0, stock: 0, oldPrice: c.price },
      c, { price: Number(c.price) || 0, stock: Number(c.stock) || 0, base: false, hidden: !!(ov[c.id] && ov[c.id].hidden) })));
    return list;
  }
  const stockState = p => p.stock <= 0 ? "out" : p.stock <= LOW ? "low" : "in";

  /* =========================================================
     STATE + FILTER
     ========================================================= */
  const state = { tab: "all", q: "", cat: "all", sort: "new", page: 1 };
  const selected = new Set();
  let editId = null, flashId = null;

  function filtered() {
    const q = state.q.toLowerCase();
    const list = allProducts().filter(p => {
      if (state.tab === "in" && stockState(p) !== "in") return false;
      if (state.tab === "low" && stockState(p) !== "low") return false;
      if (state.tab === "out" && stockState(p) !== "out") return false;
      if (state.tab === "hidden" && !p.hidden) return false;
      if (state.cat !== "all" && p.category !== state.cat) return false;
      if (q && !(p.name + " " + p.category + " " + (p.brand || "")).toLowerCase().includes(q)) return false;
      return true;
    });
    const sorts = {
      new: (a, b) => b.id - a.id, name: (a, b) => a.name.localeCompare(b.name),
      low: (a, b) => a.price - b.price, high: (a, b) => b.price - a.price,
      stockLow: (a, b) => a.stock - b.stock, stockHigh: (a, b) => b.stock - a.stock
    };
    return list.sort(sorts[state.sort] || sorts.new);
  }

  /* =========================================================
     RENDER
     ========================================================= */
  function renderStats() {
    const list = allProducts(), vis = list.filter(p => !p.hidden);
    const c = { in: 0, low: 0, out: 0 };
    list.forEach(p => c[stockState(p)]++);
    const value = vis.reduce((s, p) => s + p.price * Math.max(0, p.stock), 0);
    const cards = [
      { ic: "🛍️", k: "a", t: "Kul Products", v: list.length }, { ic: "✅", k: "b", t: "In Stock", v: c.in },
      { ic: "⚠️", k: "c", t: "Ochhu Stock", v: c.low }, { ic: "⛔", k: "d", t: "Out of Stock", v: c.out },
      { ic: "💼", k: "e", t: "Stock ni Kimmat", v: rupee(value) }
    ];
    $("stats").innerHTML = cards.map((k, i) => `<div class="stat" style="animation-delay:${i * 50}ms"><div class="ic ${k.k}">${k.ic}</div><div><small>${k.t}</small><strong>${k.v}</strong></div></div>`).join("");

    const cnt = { all: list.length, in: c.in, low: c.low, out: c.out, hidden: list.filter(p => p.hidden).length };
    const names = { all: "Badha", in: "In Stock", low: "Ochhu Stock", out: "Out of Stock", hidden: "Hidden" };
    $("tabs").innerHTML = Object.keys(names).map(k =>
      `<button class="tab ${state.tab === k ? "active" : ""}" data-tab="${k}" type="button">${names[k]}<b>${cnt[k]}</b></button>`).join("");
    $("subText").textContent = list.length + " products · " + (c.low + c.out) + " ma stock dhyan magi le chhe";
  }

  function renderCats() {
    const cats = [...new Set(allProducts().map(p => p.category))];
    if (state.cat !== "all" && !cats.includes(state.cat)) state.cat = "all";
    $("catSel").innerHTML = `<option value="all">🗂 Badhi Category</option>` +
      cats.map(c => `<option value="${esc(c)}" ${state.cat === c ? "selected" : ""}>${esc((ICONS[c] || "🛍️") + " " + c)}</option>`).join("");
  }

  function render() {
    renderStats();
    const list = filtered();
    const pages = Math.max(1, Math.ceil(list.length / PAGE));
    if (state.page > pages) state.page = pages;
    const start = (state.page - 1) * PAGE;
    const rows = list.slice(start, start + PAGE);

    if (!rows.length) {
      $("tableBox").innerHTML = `<div class="empty"><b>📭</b>Koi product malyo nahi.</div>`;
      $("pager").innerHTML = ""; renderBulk(); return;
    }
    const allOn = rows.every(p => selected.has(String(p.id)));

    $("tableBox").innerHTML = `<table>
      <thead><tr><th><input type="checkbox" id="chkAll" ${allOn ? "checked" : ""} aria-label="Badha select"></th>
        <th>Photo</th><th>Product</th><th>Price</th><th>Stock</th><th>Rating</th><th>Visible</th><th>Action</th></tr></thead><tbody>
      ${rows.map(p => {
        const id = String(p.id), s = stockState(p), d = p.oldPrice > p.price ? Math.round((1 - p.price / p.oldPrice) * 100) : 0;
        return `<tr class="${selected.has(id) ? "sel" : ""} ${p.hidden ? "hid" : ""} ${p.id === flashId ? "flash" : ""}">
          <td><input type="checkbox" data-chk="${id}" ${selected.has(id) ? "checked" : ""} aria-label="Select"></td>
          <td><img class="pimg" src="${esc(p.image || ph(p.category))}" alt="" loading="lazy" onerror="imgFail(this,'${esc(p.category).replace(/'/g, "")}')"></td>
          <td class="pn">${esc(p.name)}<small>#${p.id} · ${esc(p.category)} · ${esc(p.brand || "")}
            <span class="tag ${p.base ? "base" : "cust"}">${p.base ? "Main" : "Custom"}</span>${p.edited ? '<span class="tag edit">Edited</span>' : ""}</small></td>
          <td class="price"><b>${rupee(p.price)}</b>${p.oldPrice > p.price ? `<s>${rupee(p.oldPrice)} · ${d}% off</s>` : ""}</td>
          <td><input class="stk" type="number" min="0" step="1" value="${p.stock}" data-stk="${id}" aria-label="Stock"><br>
            <span class="pill ${s}">${s === "out" ? "Out of Stock" : s === "low" ? "Ochhu" : "In Stock"}</span></td>
          <td>${"★".repeat(Math.round(p.rating || 0))} ${p.rating || 0}<small style="display:block;color:#64748b">${(p.reviews || 0).toLocaleString("en-IN")} reviews</small></td>
          <td><button class="vis ${p.hidden ? "off" : "on"}" data-vis="${id}" type="button" title="Customer ne dekhado / chhupavo">${p.hidden ? "🙈 Hidden" : "👁 Visible"}</button></td>
          <td><div class="acts">
            <button class="ib" data-edit="${id}" title="Edit" aria-label="Edit" type="button">✏️</button>
            <a class="ib" href="../product-details.html?id=${p.id}" target="_blank" rel="noopener" title="Customer view" aria-label="View">🔗</a>
            ${p.base ? "" : `<button class="ib del" data-del="${id}" title="Delete" aria-label="Delete" type="button">🗑</button>`}
          </div></td></tr>`;
      }).join("")}</tbody></table>`;

    const pg = [];
    for (let p = 1; p <= pages; p++) {
      if (pages > 7 && p !== 1 && p !== pages && Math.abs(p - state.page) > 1) { if (pg[pg.length - 1] !== "…") pg.push("…"); continue; }
      pg.push(p);
    }
    $("pager").innerHTML = `<span>${start + 1}-${Math.min(start + PAGE, list.length)} / ${list.length} products</span>
      <div class="pgs"><button data-pg="${state.page - 1}" ${state.page === 1 ? "disabled" : ""} type="button">‹</button>
      ${pg.map(p => p === "…" ? `<button disabled>…</button>` : `<button data-pg="${p}" class="${p === state.page ? "active" : ""}" type="button">${p}</button>`).join("")}
      <button data-pg="${state.page + 1}" ${state.page === pages ? "disabled" : ""} type="button">›</button></div>`;
    renderBulk();
    flashId = null;
  }
  function renderBulk() {
    $("bulk").classList.toggle("show", selected.size > 0);
    $("bulkTxt").textContent = selected.size + " product select karya";
  }

  /* =========================================================
     SAVE HELPERS
     ========================================================= */
  function setOv(id, patch) {
    const ov = getOv();
    const cur = Object.assign({}, ov[id] || {}, patch);
    if (!cur.hidden) delete cur.hidden;
    if (Object.keys(cur).length) ov[id] = cur; else delete ov[id];
    return writeJSON("productOverrides", ov);
  }
  function updateStock(id, val) {
    const n = Math.floor(Number(val));
    if (isNaN(n) || n < 0) { showToast("Stock 0 ke vadhu purnank hovu joie"); return render(); }
    const p = allProducts().find(x => String(x.id) === String(id)); if (!p) return;
    let ok;
    if (p.base) ok = setOv(p.id, { stock: n });
    else { const l = getCustom(); const c = l.find(x => String(x.id) === String(id)); if (!c) return; c.stock = n; ok = writeJSON("customProducts", l); }
    if (ok) { flashId = p.id; showToast(p.name.slice(0, 30) + ": stock " + n); }
    render();
  }
  function setHidden(ids, hidden) {
    const ov = getOv();
    ids.forEach(id => {
      const cur = Object.assign({}, ov[id] || {});
      if (hidden) cur.hidden = true; else delete cur.hidden;
      if (Object.keys(cur).length) ov[id] = cur; else delete ov[id];
    });
    return writeJSON("productOverrides", ov);
  }
  function deleteProducts(ids) {
    const set = new Set(ids.map(String));
    const left = getCustom().filter(c => !set.has(String(c.id)));
    if (!writeJSON("customProducts", left)) return false;
    const ov = getOv(); ids.forEach(id => delete ov[id]); writeJSON("productOverrides", ov);
    return true;
  }

  /* =========================================================
     EVENTS
     ========================================================= */
  $("tableBox").addEventListener("change", e => {
    const s = e.target.closest("input[data-stk]"); if (s) return updateStock(s.dataset.stk, s.value);
    const c = e.target.closest("input[data-chk]");
    if (c) { c.checked ? selected.add(c.dataset.chk) : selected.delete(c.dataset.chk); return render(); }
    if (e.target.id === "chkAll") {
      filtered().slice((state.page - 1) * PAGE, state.page * PAGE).forEach(p => e.target.checked ? selected.add(String(p.id)) : selected.delete(String(p.id)));
      render();
    }
  });
  $("tableBox").addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches("input[data-stk]")) e.target.blur(); });
  $("tableBox").addEventListener("click", e => {
    const v = e.target.closest("[data-vis]");
    if (v) {
      const p = allProducts().find(x => String(x.id) === v.dataset.vis); if (!p) return;
      if (setHidden([p.id], !p.hidden)) { flashId = p.id; showToast(p.hidden ? "Customer ne have dekhase ✔" : "Customer thi chhupavyo 🙈"); }
      return render();
    }
    const ed = e.target.closest("[data-edit]"); if (ed) return openEdit(ed.dataset.edit);
    const d = e.target.closest("[data-del]");
    if (d) {
      const p = allProducts().find(x => String(x.id) === d.dataset.del); if (!p) return;
      if (!confirm("\"" + p.name + "\" delete karvo chhe? Aa pachhu nahi aave.")) return;
      if (deleteProducts([p.id])) { selected.delete(String(p.id)); showToast("Product delete thayo"); }
      render(); renderCats();
    }
  });
  $("tabs").addEventListener("click", e => { const t = e.target.closest("[data-tab]"); if (t) { state.tab = t.dataset.tab; state.page = 1; render(); } });
  $("pager").addEventListener("click", e => {
    const b = e.target.closest("[data-pg]"); if (!b || b.disabled) return;
    state.page = Number(b.dataset.pg); render(); window.scrollTo({ top: 0, behavior: "smooth" });
  });

  let st;
  $("searchBox").addEventListener("input", e => {
    $("searchClear").style.display = e.target.value ? "block" : "none";
    clearTimeout(st); st = setTimeout(() => { state.q = e.target.value.trim(); state.page = 1; render(); }, 200);
  });
  $("searchClear").onclick = () => { $("searchBox").value = ""; $("searchClear").style.display = "none"; state.q = ""; state.page = 1; render(); };
  $("catSel").onchange = e => { state.cat = e.target.value; state.page = 1; render(); };
  $("sortSel").onchange = e => { state.sort = e.target.value; state.page = 1; render(); };
  $("resetBtn").onclick = () => {
    Object.assign(state, { tab: "all", q: "", cat: "all", sort: "new", page: 1 });
    $("searchBox").value = ""; $("searchClear").style.display = "none"; $("sortSel").value = "new"; renderCats(); render();
  };

  /* Bulk */
  $("bulk").addEventListener("click", e => {
    const b = e.target.closest("[data-bulk]"); if (!b) return;
    const ids = [...selected].map(Number), act = b.dataset.bulk;
    if (act === "hide" || act === "show") {
      if (setHidden(ids, act === "hide")) showToast(ids.length + " product " + (act === "hide" ? "chhupavya" : "dekhadya"));
    } else {
      const customIds = ids.filter(id => { const p = allProducts().find(x => x.id === id); return p && !p.base; });
      if (!customIds.length) return showToast("Main products delete nathi thata, fakt Hide kari shako chho");
      if (!confirm(customIds.length + " custom product delete karva chho?" + (customIds.length < ids.length ? "\n(Main products delete nahi thay.)" : ""))) return;
      if (deleteProducts(customIds)) showToast(customIds.length + " product delete thaya");
    }
    selected.clear(); renderCats(); render();
  });
  $("bulkClear").onclick = () => { selected.clear(); render(); };
  $("bulkCsv").onclick = () => exportCSV(allProducts().filter(p => selected.has(String(p.id))));
  $("csvBtn").onclick = () => exportCSV(filtered());

  /* =========================================================
     EDIT MODAL
     ========================================================= */
  function openEdit(id) {
    const p = allProducts().find(x => String(x.id) === String(id)); if (!p) return;
    editId = p.id;
    $("modalBody").innerHTML = `
      <h3>✏️ Product Edit Karo</h3>
      <p class="sub">#${p.id} · ${p.base ? "Main product" : "Custom product"}</p>
      ${p.base ? `<div class="m-note">Main product nu naam ane photo badli nathi shakatu. Price, MRP, stock ane visibility badli shakay chhe.</div>` : ""}
      <div class="f"><label for="eName">Naam</label><input type="text" id="eName" value="${esc(p.name)}" ${p.base ? "readonly" : 'maxlength="80"'}><div class="err" id="eNameErr"></div></div>
      <div class="two">
        <div class="f"><label for="eCat">Category</label><input type="text" id="eCat" value="${esc(p.category)}" ${p.base ? "readonly" : 'maxlength="30"'}><div class="err" id="eCatErr"></div></div>
        <div class="f"><label for="eStock">Stock</label><input type="number" id="eStock" value="${p.stock}" min="0" step="1"><div class="err" id="eStockErr"></div></div>
      </div>
      <div class="two">
        <div class="f"><label for="ePrice">Selling Price (₹)</label><input type="number" id="ePrice" value="${p.price}" min="${MIN_PRICE}" max="${MAX_PRICE}"><div class="err" id="ePriceErr"></div></div>
        <div class="f"><label for="eOld">MRP (₹)</label><input type="number" id="eOld" value="${p.oldPrice > p.price ? p.oldPrice : ""}" min="1"><div class="err" id="eOldErr"></div></div>
      </div>
      <div class="hint" id="eHint"></div>
      <label class="chk"><input type="checkbox" id="eVis" ${p.hidden ? "" : "checked"}> Customer ne dekhado (Visible)</label>
      <div class="m-btns">
        <button class="m-save" id="eSave" type="button">💾 Save</button>
        <button class="m-cancel" id="eCancel" type="button">Cancel</button>
        ${p.base && p.edited ? `<button class="m-reset" id="eReset" type="button">↩ Original price / stock ma pachha lao</button>` : ""}
      </div>`;
    $("modalBg").classList.add("show");
    ["ePrice", "eOld"].forEach(i => $(i).addEventListener("input", hint)); hint();
  }
  function hint() {
    const pr = Number($("ePrice").value), old = Number($("eOld").value);
    $("eHint").textContent = old > pr && pr > 0 ? "🎉 Customer ne " + Math.round((1 - pr / old) * 100) + "% discount dekhase (" + rupee(old - pr) + " ni bachat)" : "";
  }
  function closeModal() { editId = null; $("modalBg").classList.remove("show"); }
  function fieldErr(id, errId, msg) { $(errId).textContent = msg || ""; $(id).classList.toggle("error", !!msg); return !msg; }

  $("modalBg").addEventListener("click", e => {
    if (e.target === $("modalBg") || e.target.id === "eCancel") return closeModal();

    if (e.target.id === "eReset") {
      const ov = getOv(); const keepHidden = ov[editId] && ov[editId].hidden;
      delete ov[editId]; if (keepHidden) ov[editId] = { hidden: true };
      if (writeJSON("productOverrides", ov)) { flashId = editId; closeModal(); render(); showToast("Original ma pachha avyu ✔"); }
      return;
    }
    if (e.target.id !== "eSave") return;

    const p = allProducts().find(x => x.id === editId); if (!p) return closeModal();
    const name = $("eName").value.trim(), cat = $("eCat").value.trim();
    const price = Number($("ePrice").value), old = $("eOld").value === "" ? 0 : Number($("eOld").value), stockRaw = $("eStock").value;
    const ok = [
      fieldErr("eName", "eNameErr", name.length < 3 ? "Minimum 3 akshar nu naam" : ""),
      fieldErr("eCat", "eCatErr", !cat ? "Category lakho" : ""),
      fieldErr("ePrice", "ePriceErr", !(price >= MIN_PRICE && price <= MAX_PRICE) ? "Price ₹" + MIN_PRICE.toLocaleString("en-IN") + " thi ₹" + MAX_PRICE.toLocaleString("en-IN") + " vachche joie" : ""),
      fieldErr("eOld", "eOldErr", old && old < price ? "MRP selling price thi ochhu na hoi shake" : ""),
      fieldErr("eStock", "eStockErr", stockRaw === "" || Number(stockRaw) < 0 || !Number.isInteger(Number(stockRaw)) ? "Stock 0 ke vadhu purnank joie" : "")
    ];
    if (ok.includes(false)) return;

    const stock = Number(stockRaw), hidden = !$("eVis").checked, finalOld = old > price ? old : price;
    let saved;
    if (p.base) {
      saved = setOv(p.id, { price, oldPrice: finalOld, stock, hidden });
    } else {
      const l = getCustom(), c = l.find(x => x.id === p.id);
      if (c) Object.assign(c, { name, category: cat, price, oldPrice: finalOld, stock });
      saved = writeJSON("customProducts", l) && setHidden([p.id], hidden);
    }
    if (!saved) return;
    flashId = p.id; closeModal(); renderCats(); render(); showToast("Product update thayo ✔");
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

  /* =========================================================
     CSV
     ========================================================= */
  function exportCSV(list) {
    if (!list.length) return showToast("Export karva mate koi product nathi");
    const q = v => '"' + String(v == null ? "" : v).replace(/"/g, '""').replace(/^([=+\-@])/, "'$1") + '"';
    const rows = [["ID", "Naam", "Category", "Brand", "Price", "MRP", "Stock", "Stock Status", "Rating", "Visible"]];
    list.forEach(p => rows.push([p.id, p.name, p.category, p.brand, p.price, p.oldPrice, p.stock, stockState(p), p.rating, p.hidden ? "No" : "Yes"]));
    const blob = new Blob(["\ufeff" + rows.map(r => r.map(q).join(",")).join("\r\n")], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "shop-smart-products.csv";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1500);
    showToast(list.length + " products CSV ma download thaya ✔");
  }

  /* =========================================================
     SIDEBAR, LOGOUT, START
     ========================================================= */
  const side = $("side"), scrim = $("scrim");
  const toggleSide = open => { side.classList.toggle("open", open); scrim.classList.toggle("show", open); };
  $("menuBtn").onclick = () => toggleSide(!side.classList.contains("open"));
  scrim.onclick = () => toggleSide(false);
  $("logoutBtn").onclick = () => {
    if (!confirm("Admin logout karvu chhe?")) return;
    try { sessionStorage.removeItem("adminSession"); } catch (e) {}
    location.href = "admin-login.html";
  };
  window.addEventListener("storage", e => { if (["customProducts", "productOverrides"].includes(e.key)) { renderCats(); render(); } });

  /* ?tab=low jevi link thi seedho tab (jem ke admin home na alert thi) */
  (function () {
    const t = new URLSearchParams(location.search).get("tab");
    if (["in", "low", "out", "hidden"].includes(t)) state.tab = t;
  })();

  renderCats();
  render();
</script>
</body>
</html>
