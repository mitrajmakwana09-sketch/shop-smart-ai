<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Shop Smart AI</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", Arial, sans-serif; color: #e5e7eb; min-height: 100vh;
      display: flex; flex-direction: column; overflow-x: hidden;
      background: radial-gradient(circle at 20% 10%, #0c4a6e 0%, #0b1220 45%, #0b1220 100%);
    }
    a { text-decoration: none; color: inherit; }
    button, input { font-family: inherit; }

    /* animated glow */
    .glow { position: fixed; border-radius: 50%; filter: blur(80px); z-index: -1; animation: move 14s ease-in-out infinite alternate; }
    .glow.g1 { width: 360px; height: 360px; background: rgba(56,189,248,.28); top: -100px; left: -80px; }
    .glow.g2 { width: 320px; height: 320px; background: rgba(74,222,128,.2); bottom: -110px; right: -70px; animation-delay: 4s; }
    @keyframes move { to { transform: translate(60px, 50px) scale(1.2); } }

    /* Header */
    header {
      background: rgba(15,23,42,.8); backdrop-filter: blur(8px); border-bottom: 1px solid rgba(255,255,255,.08);
      padding: 14px 24px; display: flex; justify-content: space-between; align-items: center;
    }
    .logo { font-size: 22px; font-weight: 800; color: #38bdf8; }
    .logo span { color: #4ade80; }
    nav a { margin-left: 18px; color: #cbd5e1; font-weight: 500; }
    nav a:hover { color: #fff; }

    .wrapper { flex: 1; display: flex; align-items: center; justify-content: center; padding: 30px 16px; }
    .card {
      width: 100%; max-width: 440px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
      border-radius: 22px; padding: 34px 30px; backdrop-filter: blur(14px);
      box-shadow: 0 24px 60px rgba(0,0,0,.45); animation: rise .6s ease both;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }

    .shield {
      width: 84px; height: 84px; border-radius: 50%; margin: 0 auto 14px; font-size: 40px;
      display: flex; align-items: center; justify-content: center; position: relative;
      background: linear-gradient(135deg, #0284c7, #16a34a); box-shadow: 0 10px 28px rgba(2,132,199,.5);
    }
    .shield::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(56,189,248,.6); animation: ring 2.4s ease-out infinite; }
    @keyframes ring { from { transform: scale(1); opacity: .8; } to { transform: scale(1.6); opacity: 0; } }
    .card h1 { text-align: center; font-size: 25px; margin-bottom: 4px; color: #fff; }
    .card .sub { text-align: center; color: #94a3b8; font-size: 14px; margin-bottom: 22px; line-height: 1.5; }

    .alert { display: none; padding: 11px 14px; border-radius: 10px; font-size: 14px; font-weight: 600; margin-bottom: 14px; line-height: 1.45; }
    .alert.show { display: block; }
    .alert.error { background: rgba(220,38,38,.18); color: #fca5a5; border: 1px solid rgba(220,38,38,.4); }
    .alert.success { background: rgba(22,163,74,.18); color: #86efac; border: 1px solid rgba(22,163,74,.4); }
    .alert.info { background: rgba(2,132,199,.18); color: #7dd3fc; border: 1px solid rgba(2,132,199,.4); }

    .field { margin-bottom: 14px; }
    .field label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; color: #cbd5e1; }
    .iw { position: relative; }
    .iw input {
      width: 100%; height: 48px; padding: 0 14px; border: 1px solid rgba(255,255,255,.18); border-radius: 12px;
      background: rgba(255,255,255,.07); color: #fff; font-size: 15px; outline: none; transition: border .2s, box-shadow .2s;
    }
    .iw input::placeholder { color: #64748b; }
    .iw input:focus { border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56,189,248,.2); }
    .iw input.error { border-color: #f87171; }
    .iw.pw input { padding-right: 48px; }
    .eye { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: none; background: none; cursor: pointer; font-size: 18px; padding: 6px; }
    .err-msg { color: #fca5a5; font-size: 13px; margin-top: 5px; }

    .btn {
      width: 100%; height: 50px; border: none; border-radius: 12px; margin-top: 8px; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer;
      background: linear-gradient(90deg, #0284c7, #16a34a, #0284c7); background-size: 200% 100%; animation: btnMove 5s linear infinite;
      transition: transform .1s, opacity .2s;
    }
    @keyframes btnMove { to { background-position: 200% 0; } }
    .btn:hover { opacity: .93; }
    .btn:active { transform: scale(.98); }
    .btn:disabled { opacity: .55; cursor: not-allowed; animation: none; }
    .btn.ghost { background: rgba(255,255,255,.1); animation: none; margin-top: 10px; }
    .btn.red { background: #b91c1c; animation: none; margin-top: 10px; }

    .strength { height: 6px; background: rgba(255,255,255,.12); border-radius: 99px; margin-top: 8px; overflow: hidden; }
    .strength i { display: block; height: 100%; width: 0; border-radius: 99px; transition: width .3s, background .3s; }
    .strength-text { font-size: 12px; margin-top: 4px; font-weight: 600; min-height: 16px; }

    .note { margin-top: 18px; font-size: 12px; color: #64748b; line-height: 1.6; text-align: center; }
    .back { display: block; text-align: center; margin-top: 14px; color: #7dd3fc; font-weight: 600; font-size: 14px; }
    .back:hover { text-decoration: underline; }
    .hidden { display: none !important; }

    footer { text-align: center; padding: 16px; color: #64748b; font-size: 13px; }

    @media (max-width: 480px) { .card { padding: 26px 18px; } nav a { margin-left: 12px; font-size: 14px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="glow g1"></div><div class="glow g2"></div>

  <header>
    <a class="logo" href="index.html">Shop <span>Smart AI</span></a>
    <nav>
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="login.html">User Login</a>
    </nav>
  </header>

  <div class="wrapper">
    <div class="card">
      <div class="shield">🔐</div>
      <h1 id="title">Admin Login</h1>
      <p class="sub" id="sub">Fakt authorised admin mate. Products manage karva login karo.</p>

      <div class="alert" id="alertBox"></div>

      <!-- SETUP (pehli vaar) -->
      <form id="setupForm" class="hidden" novalidate>
        <div class="field">
          <label for="sUser">Admin Username</label>
          <div class="iw"><input type="text" id="sUser" placeholder="Jem ke: shopadmin" maxlength="30" autocomplete="username"></div>
          <div class="err-msg" id="sUserErr"></div>
        </div>
        <div class="field">
          <label for="sPass">Password</label>
          <div class="iw pw">
            <input type="password" id="sPass" placeholder="Minimum 8 characters" autocomplete="new-password">
            <button type="button" class="eye" data-target="sPass" aria-label="Show">👁</button>
          </div>
          <div class="strength"><i id="strBar"></i></div>
          <div class="strength-text" id="strText"></div>
          <div class="err-msg" id="sPassErr"></div>
        </div>
        <div class="field">
          <label for="sPass2">Confirm Password</label>
          <div class="iw pw">
            <input type="password" id="sPass2" placeholder="Password fari lakho" autocomplete="new-password">
            <button type="button" class="eye" data-target="sPass2" aria-label="Show">👁</button>
          </div>
          <div class="err-msg" id="sPass2Err"></div>
        </div>
        <button type="submit" class="btn" id="setupBtn">Admin Account Banavo</button>
      </form>

      <!-- LOGIN -->
      <form id="loginForm" class="hidden" novalidate>
        <div class="field">
          <label for="lUser">Admin Username</label>
          <div class="iw"><input type="text" id="lUser" placeholder="Admin username" maxlength="30" autocomplete="username"></div>
          <div class="err-msg" id="lUserErr"></div>
        </div>
        <div class="field">
          <label for="lPass">Password</label>
          <div class="iw pw">
            <input type="password" id="lPass" placeholder="Admin password" autocomplete="current-password">
            <button type="button" class="eye" data-target="lPass" aria-label="Show">👁</button>
          </div>
          <div class="err-msg" id="lPassErr"></div>
        </div>
        <button type="submit" class="btn" id="loginBtn">Admin Login</button>
      </form>

      <!-- Pehla thi login -->
      <div id="already" class="hidden">
        <button class="btn" id="goPanel" type="button">Admin Panel Kholo →</button>
        <button class="btn red" id="logoutBtn" type="button">Admin Logout</button>
      </div>

      <a class="back" href="index.html">← Home par pachha jao</a>
      <p class="note">⚠️ Aa demo admin login chhe je aa j browser ma chale chhe. Real website ma server-side login joie.</p>
    </div>
  </div>

  <footer>© 2026 Shop Smart AI. All rights reserved.</footer>

  <script>
    const $ = id => document.getElementById(id);
    const ACCOUNT_KEY = "adminAccount";
    const SESSION_KEY = "adminSession";
    const MAX_TRIES = 5, LOCK_SECONDS = 60;

    /* ---------- Storage (error vagar) ---------- */
    function getAccount() {
      try {
        const a = JSON.parse(localStorage.getItem(ACCOUNT_KEY));
        return a && a.user && a.salt && a.hash ? a : null;
      } catch (e) { return null; }
    }
    function isLoggedIn() {
      try { return !!sessionStorage.getItem(SESSION_KEY); } catch (e) { return false; }
    }

    /* ---------- Hash (salt sathe SHA-256) ---------- */
    async function hashPass(pass, salt) {
      const text = salt + "::" + pass;
      try {
        if (window.crypto && crypto.subtle) {
          const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
          return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
        }
      } catch (e) {}
      return btoa(unescape(encodeURIComponent(text)));
    }
    function randomSalt() {
      try {
        const a = new Uint8Array(16); crypto.getRandomValues(a);
        return Array.from(a).map(b => b.toString(16).padStart(2, "0")).join("");
      } catch (e) { return String(Date.now()) + Math.random().toString(16).slice(2); }
    }

    /* ---------- UI helpers ---------- */
    function showAlert(msg, type) {
      const b = $("alertBox"); b.textContent = msg; b.className = "alert show " + type;
    }
    function hideAlert() { $("alertBox").className = "alert"; }
    function setErr(inputId, errId, msg) {
      $(errId).textContent = msg || "";
      $(inputId).classList.toggle("error", !!msg);
      return !msg;
    }
    document.querySelectorAll(".eye").forEach(btn => btn.addEventListener("click", () => {
      const i = $(btn.dataset.target), show = i.type === "password";
      i.type = show ? "text" : "password"; btn.textContent = show ? "🙈" : "👁";
    }));

    /* ?redirect=add-product.html (fakt aapni .html file) */
    function nextPage() {
      const r = new URLSearchParams(location.search).get("redirect");
      return r && /^[a-zA-Z0-9_\-]+\.html$/.test(r) ? r : "add-product.html";
    }
    function startSession(user) {
      try { sessionStorage.setItem(SESSION_KEY, JSON.stringify({ user, at: Date.now() })); } catch (e) {}
    }

    /* =========================================================
       SCREEN (setup / login / already)
       ========================================================= */
    function showScreen() {
      ["setupForm", "loginForm", "already"].forEach(id => $(id).classList.add("hidden"));
      hideAlert();

      if (isLoggedIn()) {
        $("title").textContent = "Admin Logged In ✔";
        $("sub").textContent = "Tame pehela thi admin tarike login chho.";
        $("already").classList.remove("hidden");
      } else if (!getAccount()) {
        $("title").textContent = "Admin Account Banavo";
        $("sub").textContent = "Pehli vaar chhe. Potanu admin username ane password pasand karo.";
        $("setupForm").classList.remove("hidden");
        showAlert("Aa account fakt tame j banavo. Password yaad rakhjo, bijane na aapsho.", "info");
      } else {
        $("title").textContent = "Admin Login";
        $("sub").textContent = "Fakt authorised admin mate. Products manage karva login karo.";
        $("loginForm").classList.remove("hidden");
        checkLock();
      }
    }

    /* =========================================================
       SETUP
       ========================================================= */
    function strength(p) {
      let s = [p.length >= 8, /[A-Z]/.test(p), /\d/.test(p), /[^A-Za-z0-9]/.test(p)].filter(Boolean).length;
      if (p.length >= 12 && s >= 3) s = 4;
      return p.length ? s : 0;
    }
    $("sPass").addEventListener("input", () => {
      const L = [
        { w: "0%", c: "#334155", t: "" }, { w: "25%", c: "#ef4444", t: "Kamjor" }, { w: "50%", c: "#f59e0b", t: "Theek" },
        { w: "75%", c: "#38bdf8", t: "Saru" }, { w: "100%", c: "#4ade80", t: "Majboot 💪" }
      ][strength($("sPass").value)];
      $("strBar").style.width = L.w; $("strBar").style.background = L.c;
      $("strText").textContent = L.t ? "Password: " + L.t : ""; $("strText").style.color = L.c;
    });

    $("setupForm").addEventListener("submit", async e => {
      e.preventDefault();
      if (getAccount()) return showScreen();            /* biji tab ma banai gayu hoy to */
      const user = $("sUser").value.trim().toLowerCase();
      const p1 = $("sPass").value, p2 = $("sPass2").value;

      const ok = [
        setErr("sUser", "sUserErr", !/^[a-z0-9_.\-]{3,30}$/.test(user) ? "3-30 akshar: a-z, 0-9, _ . - j chale" : ""),
        setErr("sPass", "sPassErr", p1.length < 8 ? "Minimum 8 characters joie" : (strength(p1) < 2 ? "Motu akshar ke ank umero" : "")),
        setErr("sPass2", "sPass2Err", p1 !== p2 ? "Password match nathi thato" : "")
      ];
      if (ok.includes(false)) return;

      $("setupBtn").disabled = true;
      const salt = randomSalt();
      const hash = await hashPass(p1, salt);
      try {
        localStorage.setItem(ACCOUNT_KEY, JSON.stringify({ user, salt, hash, createdAt: new Date().toISOString() }));
      } catch (err) {
        $("setupBtn").disabled = false;
        return showAlert("Save na thayu (browser storage block chhe).", "error");
      }
      startSession(user);
      showAlert("Admin account ban gayu ✔ Panel par laI jaie chhie...", "success");
      setTimeout(() => { location.href = nextPage(); }, 900);
    });

    /* =========================================================
       LOGIN (5 khotta prayatna pachi 60 second lock)
       ========================================================= */
    function getFail() {
      try { return JSON.parse(sessionStorage.getItem("adminFail")) || { n: 0, until: 0 }; } catch (e) { return { n: 0, until: 0 }; }
    }
    function setFail(f) { try { sessionStorage.setItem("adminFail", JSON.stringify(f)); } catch (e) {} }

    let lockTimer = null;
    function checkLock() {
      clearInterval(lockTimer);
      const f = getFail();
      const left = Math.ceil((f.until - Date.now()) / 1000);
      if (left > 0) {
        $("loginBtn").disabled = true;
        const tick = () => {
          const s = Math.ceil((getFail().until - Date.now()) / 1000);
          if (s <= 0) {
            clearInterval(lockTimer);
            setFail({ n: 0, until: 0 });
            $("loginBtn").disabled = false; $("loginBtn").textContent = "Admin Login"; hideAlert();
          } else {
            $("loginBtn").textContent = "Lock: " + s + "s";
            showAlert("Ghana khotta prayatna. " + s + " second pachhi fari prayatna karo.", "error");
          }
        };
        tick(); lockTimer = setInterval(tick, 1000);
      }
    }

    $("loginForm").addEventListener("submit", async e => {
      e.preventDefault();
      hideAlert();
      if (Date.now() < getFail().until) return;

      const acc = getAccount();
      if (!acc) return showScreen();

      const user = $("lUser").value.trim().toLowerCase(), pass = $("lPass").value;
      const ok = [
        setErr("lUser", "lUserErr", !user ? "Admin username lakho" : ""),
        setErr("lPass", "lPassErr", !pass ? "Password lakho" : "")
      ];
      if (ok.includes(false)) return;

      $("loginBtn").disabled = true;
      const hash = await hashPass(pass, acc.salt);
      const good = user === acc.user && hash === acc.hash;

      if (good) {
        setFail({ n: 0, until: 0 });
        startSession(acc.user);
        showAlert("Login safal ✔ Welcome, " + acc.user + "!", "success");
        setTimeout(() => { location.href = nextPage(); }, 700);
        return;
      }

      const f = getFail(); f.n++;
      $("lPass").value = "";
      if (f.n >= MAX_TRIES) {
        f.until = Date.now() + LOCK_SECONDS * 1000; f.n = 0; setFail(f); checkLock();
      } else {
        setFail(f);
        $("loginBtn").disabled = false;
        showAlert("Username ke password khotu chhe. " + (MAX_TRIES - f.n) + " prayatna baki.", "error");
      }
    });

    /* ---------- Already logged in ---------- */
    $("goPanel").onclick = () => { location.href = nextPage(); };
    $("logoutBtn").onclick = () => {
      try { sessionStorage.removeItem(SESSION_KEY); } catch (e) {}
      showScreen(); showAlert("Admin logout thai gayu.", "success");
    };

    showScreen();
  </script>
</body>
</html>
